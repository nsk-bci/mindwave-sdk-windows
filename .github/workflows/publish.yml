name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest
    environment: production   # Owner 명시 승인 필수 (Sprint 01 Step 6)

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test NeuroSky.Tests/NeuroSky.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack NeuroSky.Sdk/NeuroSky.Sdk.csproj -c Release --no-build -o artifacts

      - name: Push to NuGet
        shell: pwsh
        run: |
          $pkg = Get-ChildItem artifacts/*.nupkg | Select-Object -First 1
          dotnet nuget push $pkg.FullName --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
