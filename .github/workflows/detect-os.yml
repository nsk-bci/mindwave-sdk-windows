# .github/workflows/detect-os.yml
# 매일 OS 새 버전 감지 → 새 버전이면 이슈 생성 + 이메일 발송
# 데이터 소스: https://endoflife.date  (중복은 이슈 제목으로 자동 dedup)
# cron '0 0 * * *' = 매일 00:00 UTC = 09:00 KST
name: Detect OS Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  detect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform: [windows, dotnet]
    steps:
      - name: Fetch latest version
        id: f
        run: |
          P="${{ matrix.platform }}"
          JSON=$(curl -fsSL "https://endoflife.date/api/$P.json")
          VER=$(echo "$JSON" | python3 -c "import sys,json;d=json.load(sys.stdin)[0];print(d.get('latest') or d.get('cycle'))")
          REL=$(echo "$JSON" | python3 -c "import sys,json;d=json.load(sys.stdin)[0];print(d.get('releaseDate') or '')")
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "rel=$REL" >> "$GITHUB_OUTPUT"

      - name: Create issue + flag email if new
        id: n
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          P: ${{ matrix.platform }}
          VER: ${{ steps.f.outputs.ver }}
          REL: ${{ steps.f.outputs.rel }}
        run: |
          TITLE="OS Update: $P $VER"
          gh label create os-update --repo "$REPO" --color FBCA04 \
            --description "OS version detection" 2>/dev/null || true
          EXISTS=$(gh issue list --repo "$REPO" --state all --search "\"$TITLE\" in:title" \
            --json title -q '.[].title' | grep -Fx "$TITLE" || true)
          if [ -n "$EXISTS" ]; then
            echo "already notified: $TITLE"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "$P 새 버전 **$VER** 가 감지되었습니다 (릴리즈일: $REL)."
            echo
            echo "- 출처: https://endoflife.date/$P"
            echo "- 조치 필요: 이 OS 버전에서 SDK 빌드/동작 확인, 필요 시 빌드 매트릭스 및 타깃 SDK 갱신."
            echo
            echo "_자동 생성 — detect-os.yml_"
          } > "body_$P.txt"
          gh issue create --repo "$REPO" --title "$TITLE" --label os-update \
            --body-file "body_$P.txt"
          echo "new=true" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Send email
        if: steps.n.outputs.new == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.sendgrid.net
          server_port: 465
          secure: true
          username: apikey
          password: ${{ secrets.SENDGRID_API_KEY }}
          subject: "[NSK SDK] ${{ steps.n.outputs.title }}"
          to: hyuk@neurosky.com
          from: NeuroSky SDK Bot <hyuk@neurosky.com>
          body: file://body_${{ matrix.platform }}.txt
